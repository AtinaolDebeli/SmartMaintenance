<!DOCTYPE html>
<html>

<head>

<title>Suppliers - SmartMaintenance</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="header">
    <h1>🚚 Suppliers</h1>
    <a href="/logout">Logout</a>
</div>

<div class="main">

<div class="form-box">

<h2>Add Supplier</h2>

<form method="POST">

<input name="name" placeholder="Supplier name" required>

<input name="phone" placeholder="Phone number">

<input name="item" placeholder="Supplied item">

<button type="submit">Add Supplier</button>

</form>

</div>

<h2>Supplier List</h2>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Phone</th>
<th>Item</th>
</tr>

{% for s in suppliers %}

<tr>
<td>{{s.id}}</td>
<td>{{s.name}}</td>
<td>{{s.phone}}</td>
<td>{{s.item}}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">⬅ Back Dashboard</a>

</div>

</body>
</html>
