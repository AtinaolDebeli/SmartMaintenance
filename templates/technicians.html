{% extends "base.html" %}
{% block title %}Technicians{% endblock %}
{% block content %}

<h2>Technicians Management</h2>

<table class="table">
  <tr>
    <th>Name</th>
    <th>Specialty</th>
    <th>Phone</th>
  </tr>
  {% for tech in technicians %}
  <tr>
    <td>{{ tech.name }}</td>
    <td>{{ tech.specialty }}</td>
    <td>{{ tech.phone }}</td>
  </tr>
  {% endfor %}
</table>

{% endblock %}
