{% extends "base.html" %}

{% block title %}Technicians{% endblock %}

{% block content %}

<h2 class="mb-4">👨‍🔧 Technician Management</h2>

<div class="card mb-4">
    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-4">
                    <label>Technician Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Skill</label>
                    <input type="text" name="skill" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" required>
                </div>

            </div>

            <br>

            <button type="submit" class="btn btn-success">
                ➕ Add Technician
            </button>

        </form>

    </div>
</div>
