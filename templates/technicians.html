{% extends "base.html" %}
{% block title %}Technicians Management{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">Technicians Management</h2>

    <div class="mb-3">
        <button class="btn btn-primary">Add New Technician</button>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Full Name</th>
                        <th>Specialty</th>
                        <th>Phone Number</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="text-center">No technicians added yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

{% endblock %}
