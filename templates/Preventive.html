<!DOCTYPE html>
<html>

<head>

<title>Preventive Maintenance - SmartMaintenance</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="header">
    <h1>📅 Preventive Maintenance</h1>
    <a href="/logout">Logout</a>
</div>

<div class="main">

<div class="form-box">

<h2>Create Maintenance Schedule</h2>

<form method="POST">

<input name="equipment" placeholder="Equipment name" required>

<select name="schedule">
    <option>Daily</option>
    <option>Weekly</option>
    <option>Monthly</option>
    <option>Quarterly</option>
    <option>Yearly</option>
</select>

<input type="date" name="next_date" required>

<button type="submit">Save Schedule</button>

</form>

</div>

<h2>Scheduled Maintenance</h2>

<table>

<tr>
<th>ID</th>
<th>Equipment</th>
<th>Schedule</th>
<th>Next Date</th>
</tr>

{% for p in preventive %}

<tr>
<td>{{p.id}}</td>
<td>{{p.equipment}}</td>
<td>{{p.schedule}}</td>
<td>{{p.next_date}}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">⬅ Back Dashboard</a>

</div>

</body>
</html>
