{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}

<h2 class="mb-4">👥 User Management</h2>

<div class="card mb-4">
    <div class="card-body">

        <form method="POST">

            <div class="row">

                <div class="col-md-4">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label>Role</label>
                    <select name="role" class="form-control">
                        <option>Admin</option>
                        <option>Manager</option>
                        <option>Technician</option>
                    </select>
                </div>

            </div>

            <br>

            <button type="submit" class="btn btn-success">
                ➕ Add User
            </button>

        </form>

    </div>
</div>

<div class="card">

    <div class="card-header bg-primary text-white">
        System Users
    </div>

    <div class="card-body">

        <table class="table table-bordered table-hover">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>

                {% for user in users %}

                <tr>
                    <td>{{ user.id }}</td>
                    <td>{{ user.username }}</td>
                    <td>{{ user.role }}</td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
